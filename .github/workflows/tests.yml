name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs on the same PR/branch when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          with tempfile.TemporaryDirectory(prefix="logan-tests-") as scratch:
              environment = os.environ.copy()
              environment["HOME"] = scratch
              environment["MPLCONFIGDIR"] = str(Path(scratch) / "matplotlib")
              subprocess.run(
                  [sys.executable, "-m", "pytest", "--tb=short", "-q", "-p", "no:cacheprovider"],
                  env=environment, check=True,
              )
          PY

      - name: Build and inspect wheel
        run: |
          pip wheel --no-deps -w dist .
          python - <<'PY'
          from pathlib import Path
          import zipfile

          [wheel] = list(Path("dist").glob("oci_logan_mcp-*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              assert len(names) == len(set(names))
              for name in ("starter_queries.yaml", "builtin_queries.yaml"):
                  assert archive.read(f"oci_logan_mcp/data/{name}").strip()
              assert archive.read("oci_logan_mcp/__main__.py").strip()
              print(f"Verified {wheel.name}: {len(names)} unique files, both query catalogs included")
          PY
