  - processor
  unit: percent
  resource_name_dimension: resourceDisplayName
  group_by_dimensions:
  - resourceId
  - resourceDisplayName
  allowed_filter_dimensions:
  - resourceId
  - resourceDisplayName
  allowed_aggregations:
  - mean
  - max
  - min
  default_aggregation: mean
  default_interval: 5m
  resource_group: null
